version: v1
plugins:
  - name: openapiv2
    out: ../docs/static
    # json_names_for_fields=false: the SDK gateway marshals with OrigName, so responses are snake_case.
    opt: logtostderr=true,allow_merge=true,merge_file_name=openapi,output_format=yaml,fqn_for_openapi_name=true,simple_operation_ids=true,json_names_for_fields=false,openapi_configuration=openapi.config.yaml
