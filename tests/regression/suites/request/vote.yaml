# MsgVote: check order (§6.5): option, request exists, request open, bonded validator; re-vote
# overwrites. Heights (node starts at 1): create, publish and the request at 2 (expires 7s); the
# three rejects and the NO vote at 3; the YES re-vote at 4; blocks 5..7 resolve the request at 7;
# the vote on the closed request is rejected at 8. {{ valoper "bob" }} is bob's account bytes with
# the valoper prefix, so bob is the signer even though he is not a validator.
type: tx
signer: alice
msgs:
  - "@type": /glassharbor.registry.v1.MsgCreateApp
    creator: "{{ addr "alice" }}"
    title: Voted
    description: vote
    category: utilities
  - "@type": /glassharbor.registry.v1.MsgPublishVersion
    owner: "{{ addr "alice" }}"
    app_id: "1"
    version: 1.0.0
    magnet: "magnet:?xt=urn:btih:c12fe1c06bba254a9dc9f519b335aa7c1367a88a&dn=app.zip"
    checksum_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    file_size: "1234"
  - "@type": /glassharbor.registry.v1.MsgRequestBlueCheck
    owner: "{{ addr "alice" }}"
    app_id: "1"
    version: 1.0.0
---
type: create-blocks
---
type: tx
signer: validator
error: "request not found"
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "validator" }}"
    request_id: "99"
    option: VOTE_OPTION_YES
---
type: tx
signer: validator
error: "invalid field"
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "validator" }}"
    request_id: "1"
    option: VOTE_OPTION_UNSPECIFIED
---
type: tx
signer: bob
error: "signer is not a bonded validator"
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "bob" }}"
    request_id: "1"
    option: VOTE_OPTION_YES
---
type: tx
signer: validator
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "validator" }}"
    request_id: "1"
    option: VOTE_OPTION_NO
---
type: create-blocks
---
type: check
endpoint: /glassharbor/registry/v1/requests/1/votes
asserts:
  - .votes | length == 1
  - .votes[0].option == "VOTE_OPTION_NO"
  - .votes[0].height == "3"
---
type: tx
signer: validator
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "validator" }}"
    request_id: "1"
    option: VOTE_OPTION_YES
---
type: create-blocks
---
type: check
endpoint: /glassharbor/registry/v1/requests/1/votes
asserts:
  - .votes | length == 1
  - .votes[0].option == "VOTE_OPTION_YES"
  - .votes[0].height == "4"
---
type: create-blocks
count: 3
---
type: check
endpoint: /glassharbor/registry/v1/requests/1
asserts:
  - .request.status == "REQUEST_STATUS_PASSED"
---
type: tx
signer: validator
error: "request is not open"
msgs:
  - "@type": /glassharbor.registry.v1.MsgVote
    validator: "{{ valoper "validator" }}"
    request_id: "1"
    option: VOTE_OPTION_YES
---
type: create-blocks
